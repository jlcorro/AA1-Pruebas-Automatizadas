
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de registro - Pruebas automatizadas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            font-size: 23px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            background: #1e40af;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #mensaje {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .error { color: #dc2626; }
        .exito { color: #15803d; }
    </style>
</head>

<body>
    <main class="container">
        <h1>Registro de usuario</h1>

        <form id="registroForm" novalidate>
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre">

            <label for="correo">Correo electrónico</label>
            <input type="text" id="correo" name="correo">

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password">

            <button type="submit" id="registrar">Registrar usuario</button>
        </form>

        <p id="mensaje" role="status" aria-live="polite"></p>
    </main>

    <script>
        const formulario = document.getElementById("registroForm");
        const mensaje = document.getElementById("mensaje");

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            const nombre = document.getElementById("nombre").value.trim();
            const correo = document.getElementById("correo").value.trim();
            const password = document.getElementById("password").value;

            const formatoCorreo = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            mensaje.className = "";

            if (!nombre || !correo || !password) {
                mensaje.textContent = "Todos los campos son obligatorios.";
                mensaje.classList.add("error");
                return;
            }

            if (!formatoCorreo.test(correo)) {
                mensaje.textContent = "El correo electrónico no es válido.";
                mensaje.classList.add("error");
                return;
            }

            if (password.length < 6) {
                mensaje.textContent = "La contraseña debe tener al menos 6 caracteres.";
                mensaje.classList.add("error");
                return;
            }

            mensaje.textContent = "Registro exitoso.";
            mensaje.classList.add("exito");
            formulario.reset();
        });
    </script>
</body>
</html>
